name: E2E Tests

on:
  push:
    branches:
      - trunk
      - develop
  pull_request:
    # We include `labeled` so adding the label re-triggers the workflow.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      wp-rc-version:
        description: 'WordPress RC version (e.g. 6.3-RC3) — leave blank to skip'
      wc-rc-version:
        description: 'WooCommerce RC version (e.g. 9.0.0-rc.1) — leave blank to skip'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 2

jobs:
  E2eTests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_COLOR: 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Node cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.npm
          key: node-${{ hashFiles('package-lock.json') }}

      - name: Node install
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Set WordPress RC version
        if: "${{ contains(github.event.pull_request.labels.*.name, 'needs: WP RC test') }}"
        run: ./tests/e2e/bin/set-core-version.js WordPress/WordPress#master

      - name: Setup WP environment
        run: npm run env:start

      - name: Install WordPress release candidate (optional)
        if: github.event.inputs.wp-rc-version != ''
        env:
          INPUT_WP_RC_VERSION: ${{ github.event.inputs.wp-rc-version }}
        run: |
          npm run -- wp-env run tests-cli -- wp core update --version="${INPUT_WP_RC_VERSION}"
          npm run -- wp-env run tests-cli -- wp core update-db

      - name: Install WooCommerce release candidate (optional)
        if: github.event.inputs.wc-rc-version != ''
        env:
          INPUT_WC_RC_VERSION: ${{ github.event.inputs.wc-rc-version }}
        run: |
          npm run -- wp-env run tests-cli -- wp plugin update woocommerce --version="${INPUT_WC_RC_VERSION}"
          npm run -- wp-env run tests-cli -- wp wc update

      - name: Check if the site is running
        run: curl -I http://localhost:8889

      - name: Run E2E tests
        id: e2e_tests
        run: npm run test:e2e

      # Update label on SUCCESS (PRs only)
      - name: Update Success Label
        if: |
          github.event_name == 'pull_request' &&
          always() &&
          steps.e2e_tests.conclusion == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: ['status: e2e tests failing']
            })
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['status: e2e tests passing']
            })

      # Update label on FAILURE (PRs only)
      - name: Update Failure Label
        if: |
          github.event_name == 'pull_request' &&
          always() &&
          steps.e2e_tests.conclusion == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: ['status: e2e tests passing']
            })
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['status: e2e tests failing']
            })

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/test-results/report
          retention-days: 2
