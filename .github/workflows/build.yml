name: Build

on:
  workflow_call:
  push:
    branches:
      - trunk
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildExtensionBundle:
    name: Build extension bundle
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare PHP
        uses: woocommerce/grow/prepare-php@e5fa5c65e5b349b11d5679ba8958efa6e461cf36 # actions-v3
        with:
          install-deps: "no"

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@e5fa5c65e5b349b11d5679ba8958efa6e461cf36 # actions-v3
        with:
          node-version-file: ".nvmrc"
          ignore-scripts: "no"

      - name: Build production bundle
        run: |
          echo "::group::Build log"
          npm run build
          echo "::endgroup::"

      - name: Publish dev build to GitHub
        if: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
        uses: woocommerce/grow/publish-extension-dev-build@e5fa5c65e5b349b11d5679ba8958efa6e461cf36 # actions-v3
        with:
          extension-asset-path: snapchat-for-woocommerce.zip

      - name: Publish build artifact
        if: ${{ ! ( github.event_name == 'push' && github.ref_name == 'develop' ) }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: snapchat-for-woocommerce.zip
          path: ${{ github.workspace }}/snapchat-for-woocommerce.zip
          # Do not bloat the storage. Keep in only long enough for a caller workflow to pick it up and follow up with some manual debugging.
          retention-days: 2
